---
layout: layout.html
---
<div class="space-y-2">
{% for post in collections.post %}
<div class="flex justify-between items-center w-full">
	<a href="{{post.url}}" class="hover:underline hover:text-yellow-400">{{ post.data.title }}</a>
	<div class="text-sm text-gray-400">{{post.data.date  | date: "%b %d, %Y"}}</div>
</div>
{% endfor %}
</div>
