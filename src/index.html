---
layout: layout.html
---
<div class="post-list">
{% for post in collections.post %}
{% if post.data.published != false %}
<a class="post-card" href="{{post.url}}">
	<div class="post-card-title">{{ post.data.title }}</div>
	{%if post.data.summary %}
	<div class="post-card-summary">{{post.data.summary}}</div>
	{% endif %}
	<div class="post-card-date">{{post.data.date | date: "%b %d, %Y"}} · {{ post.templateContent | readingTime }} min read</div>
</a>
{% endif %}
{% endfor %}
</div>
