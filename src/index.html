---
layout: layout.html
---
<div style="display: flex; flex-direction: column; gap: 10px;">
{% for post in collections.post %}
<div style="display: flex; justify-content: space-between; align-items: center;
	width: full;">
	<a href="{{post.url}}" class="text-red-400">{{ post.data.title }}</a>
	<div style="font-size: 14px; color: #99A1AF;">{{post.data.date  | date: "%b %d, %Y"}}</div>
</div>
{% endfor %}
</div>
