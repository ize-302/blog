<!doctype html>
<html lang="en">
  <head>
    <title>{{ title | default: metadata.title }}</title>
		<meta charset="utf-8"/>
		<meta name=referrer content=origin/>
		<meta name=viewport content="width=device-width,initial-scale=1"/>
		<meta name=description content="{{ description | default: metadata.description }}"/>
		<meta property="og:type" content="website"/>
		<meta property="og:title" content="{{ title | default: metadata.title }}"/>
		<meta property="og:description" content="{{ description | default: metadata.description }}"/>
		<meta property="og:url" content="{{ metadata.url }}{{ page.url }}"/>
		<meta property="og:image" content="{{ metadata.url }}/assets/atom.png"/>
		<meta property="og:image:width" content="380"/>
		<meta property="og:image:height" content="380"/>
		<meta name="twitter:card" content="summary"/>
		<meta name="twitter:title" content="{{ title | default: metadata.title }}"/>
		<meta name="twitter:description" content="{{ description | default: metadata.description }}"/>
		<meta name="twitter:image" content="{{ metadata.url }}/assets/atom.png"/>
		<link rel="canonical" href="{{ metadata.url }}{{ page.url }}"/>
		<link href="/atom.xml" rel=alternate type=application/atom+xml/>
		<link rel="icon" type="image/png" href="/assets/atom.png" />
    <link rel="stylesheet" href="/css/style.css" />
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        document.documentElement.dataset.theme =
          stored || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      })();
    </script>
  </head>
  <body>
    <main class="page">
			<div style="display: flex; align-items: center;
				justify-content:space-between; padding: 10px 0; margin-bottom: 40px;">
				<span style="color: var(--heading); font-weight: 500; font-size: 18px; display:
					flex; align-items: center; gap: 4px;">
<a href="/" style="text-decoration:
						underline; color: var(--muted);">
					<img src="/assets/atom.png" alt="dp" style="width: 18px; height: 100%;" />
					Adavize 
</a>
</span>
					<div style="display: flex; align-items: center; gap: 10px; font-size:
					14px;">
					<a href="/projects/" style="text-decoration:
						underline; color: var(--muted);">Projects</a>
					<a href="https://github.com/ize-302" style="text-decoration:
						underline; color: var(--muted);">Github</a>
					<button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle color theme">
						<span class="icon-sun">
							<svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 -960 960 960" width="18">
								<path fill="currentColor" d="M480-360q50 0 85-35t35-85q0-50-35-85t-85-35q-50 0-85 35t-35 85q0 50 35 85t85 35Zm0 80q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-96-100 51-54 101 97-56 57Zm-98-550 97-101 59 56-100 97-56-52ZM154-212l100-96 54 51-97 101-57-56Z"/>
							</svg>
						</span>
						<span class="icon-moon">
							<svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 -960 960 960" width="18">
								<path fill="currentColor" d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"/>
							</svg>
						</span>
					</button>

				</div>
			</div>
			{{ content }}
		</main>
    <script src="/js/theme.js"></script>
  </body>
</html>
